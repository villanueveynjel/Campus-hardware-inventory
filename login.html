<!--login.html-->

{% extends 'base.html' %}{% block title %}Login - Campus Hardware Inventory{% endblock %}
{% block content %}<section class="auth-card">
  <div class="auth-icon">⌘</div><h1>Campus Hardware Inventory</h1><p class="subtitle">Laboratory Equipment Borrowing System</p>
  <form method="post" class="form-grid">
    <label>Username / Email<input name="identifier" autocomplete="username" required autofocus></label>
    <label>Password<input id="login_password" type="password" name="password" autocomplete="current-password" required></label>
    <label class="check"><input type="checkbox" onchange="togglePassword('login_password',this)"> Show Password</label>
    <button class="btn btn-primary full" type="submit">Login</button>
  </form>
  <div class="auth-links"><a href="{{ url_for('register') }}">Create an account</a><span>•</span><a href="{{ url_for('reset') }}">Reset / Unlock</a></div>
</section>{% endblock %}
